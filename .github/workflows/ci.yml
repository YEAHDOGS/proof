name: CI

on:
  push:
    # Worker/staging branches push freely — run the full suite there too so
    # regressions surface before anything nears master.
    branches: [ master, 'jack/**', 'ai-**' ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm i

      - name: Typecheck (JSDoc types -> .d.ts contract)
        run: npx tsc -p jsconfig.json --noEmit

      - name: Build Project
        run: npm run build

      - name: Build Library
        run: npm run build:lib

      - name: Run Tests
        run: npm run test:run
