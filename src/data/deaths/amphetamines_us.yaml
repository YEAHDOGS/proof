title: Psychostimulant (methamphetamine) overdose deaths, United States
verification: seeded
description: >-
  Annual count of U.S. drug-overdose deaths involving psychostimulants with
  abuse potential (primarily methamphetamine; also amphetamine and MDMA),
  from NCHS final mortality data as republished by NIDA. Most recent
  psychostimulant deaths co-involve opioids, so this overlaps the fentanyl
  series.

