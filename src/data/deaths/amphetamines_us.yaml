# Psychostimulant-involved overdose deaths, United States (ICD-10 T43.6).
# The mortality category is "psychostimulants with abuse potential" - in
# practice dominated by methamphetamine. SEEDED from the NIDA rollup of NCHS
# final data; re-verify against CDC WONDER before flipping to cross-checked.

id: deaths.amphetamines.us.overdose
