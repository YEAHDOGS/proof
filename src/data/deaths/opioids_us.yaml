# Opioid-involved overdose deaths, United States (any opioid, ICD-10 T40.0-T40.4, T40.6).
# SEEDED from the NIDA overdose-rates rollup of NCHS final data; every value
# must be re-verified against CDC WONDER before this flips to cross-checked.

id: deaths.opioids.us.overdose
substance: OPIOIDS
geo: US
metric: overdose_deaths
unit: deaths
title: Opioid-involved overdose deaths, United States
verification: seeded
description: >-
  Annual count of U.S. drug-overdose deaths involving any opioid (prescription
  opioids, heroin, and synthetic opioids such as fentanyl), from NCHS final
  mortality data as republished by NIDA. Categories overlap - a death involving
  both fentanyl and cocaine appears in both series - so families must not be
  summed across substances.

