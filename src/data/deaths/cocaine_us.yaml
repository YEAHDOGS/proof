# Cocaine-involved overdose deaths, United States (ICD-10 T40.5).
# SEEDED from the NIDA overdose-rates rollup of NCHS final data; re-verify
# against CDC WONDER before flipping to cross-checked.

id: deaths.cocaine.us.overdose
substance: COCAINE
geo: US
metric: overdose_deaths
unit: deaths
title: Cocaine-involved overdose deaths, United States
verification: seeded
description: >-
  Annual count of U.S. drug-overdose deaths involving cocaine (crack and
  powder are not separated in mortality coding), from NCHS final mortality
  data as republished by NIDA. A large majority of recent cocaine deaths also
  involve synthetic opioids, so this overlaps the fentanyl series.

