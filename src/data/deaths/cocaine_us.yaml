# Cocaine-involved overdose deaths, United States (ICD-10 T40.5).
# SEEDED from the NIDA overdose-rates rollup of NCHS final data; re-verify
# against CDC WONDER before flipping to cross-checked.

id: deaths.cocaine.us.overdose
substance: COCAINE
geo: US
metric: overdose_deaths
unit: deaths
title: Cocaine-involved overdose deaths, United States
verification: seeded
description: >-
  Annual count of U.S. drug-overdose deaths involving cocaine (crack and
  powder are not separated in mortality coding), from NCHS final mortality
  data as republished by NIDA. A large majority of recent cocaine deaths also
  involve synthetic opioids, so this overlaps the fentanyl series.

observations:
  - year: 2021
    val: 24_486
    basis: reported
    citations:
      - src: nida_overdose_rates
        url: https://nida.nih.gov/research-topics/trends-statistics/overdose-death-rates
        val: 24_486
        note: Overdose deaths involving cocaine, 2021 (NCHS final data).
      - src: cdc_wonder
        url: https://wonder.cdc.gov/mcd.html
        note: Underlying Multiple Cause of Death data; verify via T40.5 query.

  - year: 2022
    val: 27_569
    basis: reported
    citations:
      - src: nida_overdose_rates
        url: https://nida.nih.gov/research-topics/trends-statistics/overdose-death-rates
        val: 27_569
        note: Overdose deaths involving cocaine, 2022 (NCHS final data).
      - src: cdc_wonder
        url: https://wonder.cdc.gov/mcd.html
        note: Underlying Multiple Cause of Death data; verify via T40.5 query.

  - year: 2023
    val: 29_918
    basis: reported
    citations:
      - src: nida_overdose_rates
        url: https://nida.nih.gov/research-topics/trends-statistics/overdose-death-rates
        val: 29_918
        note: Overdose deaths involving cocaine, 2023 (NCHS final data).
      - src: cdc_wonder
        url: https://wonder.cdc.gov/mcd.html
        note: Underlying Multiple Cause of Death data; verify via T40.5 query.

  # A second 2023 observation follows: the CDC NCHS provisional estimate
  # (30,833), a different series from the NCHS final count above (29,918).
  # Provisional estimates are later revised; both are kept so the
  # disagreement is visible, not averaged away.
  - year: 2023
    val: 30_833
    basis: reported
    citations:
      - src: cdc_nchs_overdose_2024_provisional
        url: https://www.cdc.gov/nchs/pressroom/releases/20250514.html
        val: 30_833
        note: Estimated cocaine-involved overdose deaths, 2023 - CDC NCHS provisional estimate (12-month period ending December 2023). Provisional; superseded by the NCHS final count (29,918, previous observation).

  - year: 2024
    val: 22_174
    basis: reported
    citations:
      - src: cdc_nchs_overdose_2024_provisional
        url: https://www.cdc.gov/nchs/pressroom/releases/20250514.html
        val: 22_174
        note: Estimated cocaine-involved overdose deaths, 2024 (provisional). "Involving cocaine" - frequently polydrug contexts with fentanyl; CDC cautions that category sums do not equal the total overdose count.
      - src: cdc_nchs_overdose_2024_final
        url: https://www.cdc.gov/nchs/pressroom/releases/20260129.html
        note: Final 2024 NCHS release (Jan 2026); consult for the final series superseding these provisional figures.
