# Deaths from excessive alcohol use, United States (CDC ARDI).
# ARDI publishes multi-year annual averages from a model over ~58
# alcohol-attributable conditions - the `period` field carries the true
# window and basis is 'modelled' per the integrity policy.
# SEEDED from the campaign app's hempHealth migration inventory; re-verify against
# the ARDI application before flipping to cross-checked.

id: deaths.alcohol.us.excess
substance: ALCOHOL
geo: US
metric: excess_deaths
unit: deaths_per_year
title: Deaths from excessive alcohol use, United States (annual average)
verification: seeded
description: >-
  Estimated average annual deaths attributable to excessive alcohol use, from
  CDC's Alcohol-Related Disease Impact application. This is a model over
  fully and partially alcohol-attributable conditions (liver disease, alcohol
  poisoning, crashes, cancers, and more), not a death-certificate count - a
  much broader and larger figure than NCHS "alcohol-induced deaths".

observations:
  - year: 2021
    val: 178_307
    basis: modelled
    period: 2020-2021 annual average
    citations:
      - src: cdc_ardi
        url: https://nccd.cdc.gov/DPH_ARDI/default/default.aspx
        val: 178_307
        note: Average annual deaths from excessive alcohol use, 2020-2021, ARDI application.
      - src: cdc_alcohol_facts
        url: https://www.cdc.gov/alcohol/facts-stats/index.html
        note: Headline page states more than 178,000 people die from excessive alcohol use in the U.S. each year (2020-2021 average).

  # A second observation for the same data-window end year: the 2016-2021
  # annual average reported in MMWR (Feb 2024), alongside the 2020-2021 ARDI
  # average above. Same `year`, different window and publication - the
  # `period` field carries the true window. Year-lookups return the first
  # (the more current 2020-2021 window).
  - year: 2021
    val: 178_000
    basis: modelled
    period: 2016-2021 annual average
    citations:
      - src: cdc_excessive_drinking_facts
        url: https://www.cdc.gov/drink-less-be-your-best/facts-about-excessive-drinking/index.html
        val: 178_000
        note: ~178,000 deaths/year from excessive alcohol use, average annual 2016-2021, reported in MMWR Feb 2024 (rounded headline figure).
