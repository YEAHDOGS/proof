# Reported public-health outcomes of recreational cannabis legalization, US.
# SEEDED 2026-09-09 from the vice-mortality comparison research report.

id: policy.cannabis.us.legalization_outcomes
substance: CANNABIS
geo: US
metric: legalization_outcome
unit: relative_change
title: Reported public-health outcomes of recreational cannabis legalization, US
verification: seeded
description: >-
  Effect estimates from the legalization-outcomes literature, expressed as
  relative change versus prohibition baselines (0.0 = no detected effect).
  Bottom line from the research: evidence supports a neutral-to-modestly-
  favorable public-health profile versus prohibition, with two robust
  cautions - impaired-driving risk, and rising cannabis-use-disorder rates
  tied to higher THC potency. A meta-review of 16 studies (Chihuri & Li,
  Injury Epidemiology 2019) finds the evidence on opioid-mortality reduction
  "inconsistent and inconclusive" - modest at best, limited to states with
  operational dispensaries. Marinello & Powell found no effect on suicide.
  Portugal (decriminalization plus harm reduction since 2001): by 2017 the
  lowest drug-related death rate in Western Europe (AMA J Ethics 2024),
  injection-related HIV infections down ~95%, treatment uptake rose -
  causality cannot be firmly established.

observations:
