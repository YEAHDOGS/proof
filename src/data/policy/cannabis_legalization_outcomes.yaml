        val: -0.11
        note: Recreational markets associated with 11% fewer opioid-overdose deaths on average (range 3-28%); 7 states, death certificates 2009-2019 (Marinello & Powell, Social Science & Medicine 2023).

  - year: 2023
    val: 0.19
