# Maximum published THC metabolite detection window in urine ("up to" hours).
# Urine labs detect THCCOOH, the THC metabolite - so urine answers "have
# you used in the last month," not "are you impaired today." The gap
# between this figure and the oral-fluid figure is the core legislative
# argument for recency-based testing in employment law. SEEDED -
# re-verify each figure against the cited tables before flipping to
# cross-checked.

id: testing.cannabis.us.detection_window_urine
substance: CANNABIS
geo: US
metric: detection_window_urine
unit: hours_up_to
title: THC metabolite detection window in urine, United States
verification: seeded
description: >-
  Maximum published THC-metabolite detection window in urine, up to 67
  days (1,608 hours) in chronic users at the EMIT 20 ng/mL cutoff, per
  the cited study table. The standard workplace range runs 1-30 days
  depending on use frequency and cutoff - a once-a-month user and a daily
  user produce wildly different urine results for identical impairment on
  the day of the test. That asymmetry is the honest argument for
  oral-fluid testing (see
  testing.cannabis.us.detection_window_oral_fluid), and the reason swab
  testing is simultaneously the stricter gate for recent use.

