    val: 85_000_000_000
    basis: modelled
    period: constant 2009 dollars
    citations:
      - src: unodc_cocaine_market_2010
        url: https://news.un.org/en/story/2011/05/374612
        val: 85_000_000_000
        note: UNODC World Drug Report 2010 - global cocaine retail market ~$85B (constant 2009 dollars; range $75-100B) in 2009; ~$84B in estimated global profit. US ~$37B / Europe ~$33B (2011 Fedotov statement, via UN News). DATED - no updated comprehensive valuation has been published since.
