# Crash risk after acute cannabis use (meta-analytic odds ratios).
# Seeded 2026-09-09. The honest picture: the widely quoted OR 2.66 is a CRUDE
# estimate - studies that adjust for alcohol and other confounders find a
# smaller but still real elevation (OR ~1.2-1.3). NASEM 2017 rates the link
# "substantial evidence".

id: health.cannabis.world.driving_crash_or
substance: CANNABIS
geo: WORLD
metric: motor_vehicle_crash_odds_ratio
unit: odds_ratio
title: Motor-vehicle crash odds ratio after acute cannabis use (meta-analyses)
verification: cross-checked
description: >-
  Three meta-analytic estimates of crash risk after acute cannabis use,
  spanning the crude-to-adjusted range. Li et al. 2012 (9 studies): crude OR
  2.66 (95% CI 2.07-3.41) - but built from unadjusted odds ratios, and five
  of nine studies used self-reported cannabis use. Asbridge et al. 2012:
  OR 1.92 (95% CI 1.35-2.73), restricted to drivers testing negative for
  alcohol and other drugs. Rogeberg & Elvik 2016 re-analysis using only
  ADJUSTED odds ratios from the underlying studies: most defensible OR 1.22 -
  still elevated, far below the crude 2.66. Additional context: French
  responsibility analyses show crash responsibility rising with blood THC
  (adjusted OR 1.57 at <1 ng/mL up to 2.12 at >= 5 ng/mL), and NASEM 2017
  concludes "substantial evidence" of a statistical association between
  cannabis use and increased crash risk. Note: THC in blood does not prove
  acute impairment, and concurrent alcohol (common in cannabis-positive
  drivers) inflates the crude estimates.

