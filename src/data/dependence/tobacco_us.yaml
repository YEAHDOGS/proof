# Lifetime tobacco dependence among ever-smokers, United States.
# SEEDED 2026-09-09 from the vice-mortality comparison research report.

id: dependence.nicotine.us.share
substance: NICOTINE
geo: US
metric: dependence_share
unit: share_of_users
title: Share of tobacco users who develop dependence, United States
verification: seeded
description: >-
  Lifetime share of ever-smokers who develop tobacco dependence, from the
  National Comorbidity Survey (Anthony, Warner & Kessler 1994, DSM-III-R
  criteria, US adults 15-54). Dated, but the standard cross-drug comparison
  point. Nicotine is consistently among the most dependence-liable
  substances. Tobacco kills via chronic disease (cancer, heart disease,
  COPD), not acute overdose.

