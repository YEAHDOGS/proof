# Cocaine dependence liability, United States: lifetime share plus speed of onset.
# SEEDED 2026-09-09 from the vice-mortality comparison research report.

id: dependence.cocaine.us.share
substance: COCAINE
geo: US
metric: dependence_share
unit: share_of_users
title: Share of cocaine users who develop dependence, United States
verification: seeded
description: >-
  Two complementary measures. The 1994 observation is the lifetime share
  from the National Comorbidity Survey (Anthony, Warner & Kessler 1994,
  DSM-III-R criteria, US adults 15-54) - the standard cross-drug comparison
  point. The 2011 observation measures speed of onset instead: the share
  dependent within the first year of use. Dependence develops much faster
  for cocaine than for alcohol. The two observations are not comparable as
  a trend; the notes say which definition each uses.

observations:
  - year: 1994
    val: 0.17
    basis: reported
    citations:
      - src: anthony_1994
        url: https://johnhogan.info/hogan/CHEM_1002/Info/Chapter%2018/OriginalCaptureRatePaper.pdf
        val: 0.17
        note: ~16-17% of cocaine users developed lifetime dependence, Anthony et al. 1994.

  - year: 2011
    val: 0.071
    basis: reported
    citations:
      - src: lopez_quintero_2011_via_pmc3855905
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3855905/
        val: 0.071
        note: 7.1% of cocaine users dependent within the first year of use (Lopez-Quintero et al. 2011, as reported in Sartor et al.); dependence develops much faster than for alcohol.
