# Past-year alcohol users, United States, ages 12+ (SAMHSA NSDUH).
# The standardized Usage measure (absolute persons) and the DEFAULT alcohol
# usage dataset - unqualified queries (Substances.Alcohol.Usage(...)) resolve
# here; the past-month prevalence percentage stays reachable via
# { metric: 'past_month_use' }. SEEDED per project spec Aug 2026.

id: usage.alcohol.us.past_year_users
substance: ALCOHOL
geo: US
metric: past_year_users
unit: persons_12_plus
title: Past-year alcohol users, United States, ages 12 or older
verification: seeded
default: true
description: >-
  Estimated number of people aged 12 or older in the U.S. civilian,
  noninstitutionalized population who used alcohol in the past year, from the
  NSDUH annual national reports. The absolute-count companion to the
  past-month prevalence series - counts are the standardized cross-substance,
  cross-geography Usage measure.

observations:
  - year: 2026
    val: 178_700_000
    basis: reported
    period: most recent NSDUH annual estimate as of 2026
    citations:
      - src: samhsa_nsduh
        url: https://datatools.samhsa.gov/das
        val: 178_700_000
        note: Roughly 178.7 million people aged 12 or older used alcohol in the past year. Seeded per project spec - pin to the exact NSDUH annual report, table, and survey year during cross-check.
      - src: nsduh_2024_annual_report
        url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56287/2024-nsduh-annual-national/2024-nsduh-annual-national-html-071425-edited/2024-nsduh-annual-national.htm
        note: Companion prevalence in the 2024 report - 134.3 million past-month users (46.6 percent); verify the past-year count against the same table set.
