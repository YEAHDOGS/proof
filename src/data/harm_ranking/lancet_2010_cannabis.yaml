metric: overall_harm_score
unit: harm_score_0_100
title: Lancet 2010 overall harm score - cannabis
verification: seeded
description: >-
  Nutt, King & Phillips (The Lancet, 2010): multicriteria decision analysis
  scoring 20 drugs on 16 harm criteria - harm to the user plus harm to
  others - by a UK expert panel. Cannabis scored 20, well below alcohol
  (72), heroin (55), crack (54), cocaine (27), and tobacco (26). A 2020
  German addiction-medicine expert ranking corroborates the ordering:
  cannabis 16th of 30 substances overall (low harm), nicotine 3rd on
  physical harm to the user, alcohol 4th overall. Expert consensus, NOT a
  mortality comparison.

