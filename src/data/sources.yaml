# Central source catalog. Every citation anchor in every dataset resolves
# against the keys in this file. Add a source here first, then cite it.
#
# Catalog entries are typed as SourceCitation (src/types.js).

samhsa_nsduh:
  name: National Survey on Drug Use and Health (NSDUH)
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/data-we-collect/nsduh-national-survey-drug-use-and-health
  data_tool: https://datatools.samhsa.gov/das
  note: Annual survey of the U.S. civilian, noninstitutionalized population aged 12 or older. Multimode collection began in 2021; SAMHSA cautions against trend comparisons with 2020-and-earlier surveys.

nsduh_2021_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2021 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt39443/2021NSDUHNNR122322/2021NSDUHNNR122322.htm
  year: 2022

nsduh_2022_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2022 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt42731/2022-nsduh-annual-national-web-110923/2022-nsduh-nnr.htm
  year: 2023

nsduh_2023_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2023 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt47095/National%20Report/National%20Report/2023-nsduh-annual-national.htm
  year: 2024

nsduh_2024_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2024 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56287/2024-nsduh-annual-national/2024-nsduh-annual-national-html-071425-edited/2024-nsduh-annual-national.htm
  year: 2025

nsduh_2023_sae_texas:
  name: 2022-2023 NSDUH State-Level Estimates - Texas State Tables
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56188/2023-nsduh-sae-state-tables_0/2023-nsduh-sae-state-tabs-texas.pdf
  year: 2024
  note: Small-area estimates; percentages are 2022-2023 annual averages, not single-year figures.

nsduh_2023_sae_percent_tables:
  name: 2022-2023 NSDUH State Estimates of Substance Use - Percentages Tables
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56185/2023-nsduh-sae-tables-percents/2023-nsduh-sae-tables-percent.pdf
  year: 2024
  note: National compilation; Table 2 is Marijuana Use in the Past Year by age group and state.

nhtsa_fars:
  name: Fatality Analysis Reporting System (FARS)
  publisher: NHTSA
  url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
  note: Reserved for planned safety datasets (impaired-driving fatalities, DUIs).

umich_mtf:
  name: Monitoring the Future
  publisher: University of Michigan
  url: https://monitoringthefuture.org/
  note: Reserved for planned school-age usage datasets.

dea_scheduling:
  name: Drug Scheduling
  publisher: DEA
  url: https://www.dea.gov/drug-information/drug-scheduling
  note: Federal Controlled Substances Act schedule definitions and drug lists.

usc_farm_bill_2018:
  name: Agriculture Improvement Act of 2018 (Public Law 115-334)
  publisher: U.S. Congress
  url: https://www.congress.gov/bill/115th-congress/house-bill/2
  year: 2018
  note: Removed hemp (cannabis at or below 0.3 percent delta-9 THC by dry weight) from the CSA definition of marijuana.

tx_hb_1325_2019:
  name: House Bill 1325 (86R) - Texas consumable hemp program
  publisher: Texas Legislature
  url: https://capitol.texas.gov/BillLookup/History.aspx?LegSess=86R&Bill=HB1325
  year: 2019
  note: Authorized consumable hemp products in Texas, mirroring the 2018 Farm Bill threshold.

tx_hsc_481:
  name: Texas Health and Safety Code Chapter 481 (Texas Controlled Substances Act)
  publisher: Texas Legislature
  url: https://statutes.capitol.texas.gov/Docs/HS/htm/HS.481.htm
  note: State scheduling, penalty groups, and possession offenses.

nida_cannabis:
  name: Cannabis (Marijuana) DrugFacts
  publisher: NIDA
  url: https://nida.nih.gov/research-topics/cannabis-marijuana
  note: Compound descriptions and health-effect summaries.

cdc_wonder:
  name: CDC WONDER - Multiple Cause of Death database
  publisher: CDC / NCHS
  url: https://wonder.cdc.gov/mcd.html
  data_tool: https://wonder.cdc.gov/
  note: Underlying mortality microdata for all drug-overdose death series (ICD-10 T-codes). Final data lag about two years.

nida_overdose_rates:
  name: Drug Overdose Death Rates (trends and statistics)
  publisher: NIDA
  url: https://nida.nih.gov/research-topics/trends-statistics/overdose-death-rates
  note: Republishes NCHS/CDC WONDER national overdose death counts per drug category (opioids, synthetic opioids, cocaine, heroin, psychostimulants) with charts; convenient citable rollup of the WONDER data.

cdc_ardi:
  name: Alcohol-Related Disease Impact (ARDI) application
  publisher: CDC
  url: https://www.cdc.gov/ardi/index.html
  data_tool: https://nccd.cdc.gov/DPH_ARDI/default/default.aspx
  note: Model-based estimates of deaths attributable to excessive alcohol use (about 58 conditions, incl. fully and partially alcohol-attributable). Published as multi-year annual averages, not single years.

cdc_alcohol_facts:
  name: Facts About U.S. Deaths from Excessive Alcohol Use
  publisher: CDC
  url: https://www.cdc.gov/alcohol/facts-stats/index.html
  note: Headline page for the ARDI estimates ("more than 178,000 deaths per year, 2020-2021").

samhsa_dawn:
  name: Drug Abuse Warning Network (DAWN)
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/data-we-collect/dawn-drug-abuse-warning-network
  note: Nationally representative surveillance of drug-related emergency department visits. Annual national estimates per substance.

dea_facts_marijuana:
  name: Drug Fact Sheet - Marijuana/Cannabis
  publisher: DEA
  url: https://www.dea.gov/factsheets/marijuana-cannabis
  note: States that no deaths from marijuana overdose have been reported.

un_wpp:
  name: World Population Prospects
  publisher: United Nations
  url: https://population.un.org/wpp/
  note: UN's official global population estimates and projections, revised roughly every two years. Mid-year estimates.

census_popest:
  name: Population Estimates Program (Vintage estimates)
  publisher: U.S. Census Bureau
  url: https://www.census.gov/programs-surveys/popest.html
  note: Annual July 1 estimates for the nation, states, and localities. Each vintage revises prior years - cite the vintage.

census_popclock:
  name: U.S. and World Population Clock
  publisher: U.S. Census Bureau
  url: https://www.census.gov/popclock/
  note: Running projection; the Bureau publishes headline Jan 1 projections from it each New Year.

congress_gov:
  name: Congress.gov member directory
  publisher: Library of Congress
  url: https://www.congress.gov/members
  note: Official roster of current U.S. senators and representatives.

tx_legislature_online:
  name: Texas Legislature Online
  publisher: Texas Legislature
  url: https://capitol.texas.gov/
  note: Official roster and structure of the Texas Senate (31) and House (150).

cdc_tobacco_facts:
  name: Smoking & Tobacco Use - Fast Facts
  publisher: CDC
  url: https://www.cdc.gov/tobacco/data_statistics/fact_sheets/fast_facts/index.htm
  note: Headline adult smoking/vaping prevalence and smoking-attributable mortality figures. CDC reorganized its tobacco pages in 2024 - re-pin the exact URL during cross-check.

sg_tobacco_2014:
  name: The Health Consequences of Smoking - 50 Years of Progress (Surgeon General's report)
  publisher: HHS
  url: https://www.ncbi.nlm.nih.gov/books/NBK179276/
  year: 2014
  note: Source of the 480,000-plus annual smoking-attributable deaths estimate (including secondhand smoke) that CDC still cites as current.

who_alcohol:
  name: Global status report on alcohol and health
  publisher: WHO
  url: https://www.who.int/publications/i/item/9789240096745
  note: WHO's global estimates of current drinkers, per-capita consumption, and alcohol-attributable harm. Global drinker counts are modelled estimates, not survey counts.

whitney_tx_hemp_2025:
  name: Texas Hemp-Derived Cannabinoid Market Analysis (2025)
  publisher: Whitney Economics
  url: https://whitneyeconomics.com/
  year: 2025
  note: Industry economic analysis of the Texas consumable-hemp market; source of the $5.5B annual retail sales, $10.3B economic impact, and 53,300 jobs figures used by the campaign. Industry-commissioned - treat as modelled, not agency-reported.

# --- Vice-mortality comparison research (2026-09-09) ---
# Sources for the dependence, global deaths, harm-ranking, policy, and
# cannabis medical-evidence datasets. Values copied verbatim from the
# research report; see workspace/research_notes/vice-mortality-comparison-stats-20260909-1712/report.md.

anthony_1994:
  name: Comparative Epidemiology of Dependence on Tobacco, Alcohol, Controlled Substances, and Inhalants - Basic Findings From the National Comorbidity Survey
  publisher: American Psychological Association (Experimental and Clinical Psychopharmacology)
  url: https://johnhogan.info/hogan/CHEM_1002/Info/Chapter%2018/OriginalCaptureRatePaper.pdf
  year: 1994
  note: Anthony, Warner & Kessler 1994 (NCS). Lifetime dependence figures under DSM-III-R for US adults 15-54. Dated, but remains the standard cross-drug comparison; the https copy of the paper was verified reachable 2026-09-09.

cdc_nchs_overdose_2024_provisional:
  name: U.S. Overdose Deaths Decrease Almost 27% in 2024
  publisher: CDC / NCHS
  url: https://www.cdc.gov/nchs/pressroom/releases/20250514.html
  year: 2025
  note: NCHS provisional drug-overdose estimates (12-month periods ending December). Provisional figures are incomplete and subject to change; the 2023 comparison figures here (opioids 83,140) are provisional estimates, distinct from NCHS final counts republished by NIDA.

cdc_nchs_overdose_2024_final:
  name: U.S. Overdose Deaths 2024 - final NCHS release
  publisher: CDC / NCHS
  url: https://www.cdc.gov/nchs/pressroom/releases/20260129.html
  year: 2026
  note: Final 2024 NCHS release; consult it for the final series superseding the provisional estimates.

lopez_quintero_2011_via_pmc3855905:
  name: Rate of Progression from First Use to Dependence on Cocaine or Opioids (Sartor et al., via PMC3855905)
  publisher: PMC (NIH)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3855905/
  year: 2014
  note: Reports the Lopez-Quintero et al. (2011) finding that 7.1% of cocaine users developed dependence within the first year, vs less than 2% for alcohol, nicotine, or cannabis users.

webmd_opioid_statistics:
  name: Opioid Use Statistics
  publisher: WebMD
  url: https://www.webmd.com/mental-health/addiction/cm/opioid-use-statistics
  note: Summarizes the Vowles et al. (2015) systematic review (21-29% of chronic-pain patients misuse opioids; 8-12% develop an opioid use disorder) and NIDA figures.

cdc_cannabis_addiction:
  name: Marijuana Addiction
  publisher: CDC
  url: https://www.cdc.gov/marijuana/health-effects/addiction.html
  note: States about 3 in 10 cannabis users meet cannabis use disorder criteria, citing Hasin et al., JAMA Psychiatry 2015.

nih_younger_age_sud:
  name: Younger age at first cannabis use or prescription drug misuse associated with faster development of substance use disorders
  publisher: NIH
  url: https://www.nih.gov/news-events/news-releases/younger-age-first-cannabis-use-or-prescription-drug-misuse-associated-faster-development-substance-use-disorders
  year: 2021
  note: NIDA 2021 news release; covers faster SUD progression, including 30% of young adults developing heroin use disorder within a year of first heroin use (JAMA Pediatrics).

cdc_excessive_drinking_facts:
  name: Facts About Excessive Drinking
  publisher: CDC
  url: https://www.cdc.gov/drink-less-be-your-best/facts-about-excessive-drinking/index.html
  note: Headline page for excessive-drinking mortality; the ~178,000/year average for 2016-2021 was reported in MMWR, Feb 2024.

who_tobacco_factsheet:
  name: Tobacco fact sheet
  publisher: WHO
  url: https://www.who.int/docs/default-source/campaigns-and-initiatives/world-no-tobacco-day-2020/wntd-tobacco-fact-sheet.pdf
  year: 2020
  note: ">8 million deaths/year from tobacco (>7M direct use, ~1.2M secondhand). WHO's headline global figure."

paho_alcohol_drug_deaths_2024:
  name: Over 3 million annual deaths due to alcohol and drug use, majority among men
  publisher: PAHO / WHO
  url: https://www.paho.org/en/news/25-6-2024-over-3-million-annual-deaths-due-alcohol-and-drug-use-majority-among-men
  year: 2024
  note: "Reports WHO's Global status report on alcohol and health (2019 data, published June 2024): 2.6M alcohol deaths/year (4.7% of all deaths) and 0.6M deaths/year from all psychoactive drug use combined. WHO publishes no drug-by-drug global breakdown."

nutt_lancet_2010:
  name: Drug harms in the UK - a multicriteria decision analysis
  publisher: The Lancet
  url: https://www.psychoactif.org/forum/uploads/documents/166/nutt2010.pdf
  year: 2010
  note: Nutt, King & Phillips 2010. UK-expert consensus scores for 20 drugs across 16 harm criteria (harm to the user plus harm to others). Not a mortality comparison; alcohol/tobacco scores reflect their huge user bases and social harms.

nasem_cannabis_2017:
  name: The Health Effects of Cannabis and Cannabinoids - The Current State of Evidence and Recommendations for Research
  publisher: National Academies of Sciences, Engineering, and Medicine
  url: https://nap.nationalacademies.org/read/24625/chapter/2
  year: 2017
  note: "doi:10.17226/24625. Evidence grades per indication: conclusive/substantial, moderate, limited, insufficient."

marinello_powell_2023:
  name: Legal cannabis markets linked to increased motor vehicle deaths
  publisher: University of Illinois Chicago
  url: https://publichealth.uic.edu/news-stories/legal-cannabis-markets-linked-to-increased-motor-vehicle-deaths/
  year: 2023
  note: "Summarizes Marinello & Powell 2023 (Social Science & Medicine): recreational cannabis markets in 7 states (death certificates 2009-2019) associated with 11% fewer opioid-overdose deaths on average (range 3-28%), but 16-22% more motor-vehicle crash fatalities in some states; no effect on suicide."

rml_systematic_review_2023:
  name: Systematic review of recreational marijuana legalization outcomes (32 studies)
  publisher: PMC (NIH)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9874703/
  year: 2023
  note: Found no effect of recreational legalization on adolescent/young-adult use; possible increases in traffic crashes/fatalities and health-service use; association with decreased opioid prescriptions.

usatoday_marijuana_legal_map_2026:
  name: Where is marijuana legal? US map
  publisher: USA Today
  url: https://www.usatoday.com/story/news/nation/2026/04/16/where-is-marijuana-legal-us-map/89608617007/
  year: 2026
  note: "Reports NCSL 2025 data: 24 US states plus DC allow recreational cannabis; medical cannabis legal in 40 states plus DC."

# --- Cannabis non-fatal harms research (2026-09-09, octopus worker) ---
# Primary studies below are summarized via the cited secondary pages; each
# entry names the primary paper and its DOI so the chain stays checkable.

healio_diforti_2019:
  name: Daily, high-potency cannabis use increases psychosis risk
  publisher: Healio
  url: https://www.healio.com/news/psychiatry/20190320/daily-highpotency-cannabis-use-increases-psychosis-risk
  year: 2019
  note: "Reports Di Forti et al., 'The contribution of cannabis use to variation in the incidence of psychotic disorder across Europe (EU-GEI)', The Lancet Psychiatry 2019;6:427-436, doi:10.1016/S2215-0366(19)30048-3. Multicentre case-control: 901 first-episode psychosis patients, 1,237 controls, 11 sites across Europe and Brazil."

medscape_diforti_2019:
  name: High Potency Cannabis Tied to 50% of New Psychosis Cases
  publisher: Medscape
  url: https://www.medscape.com/viewarticle/910658
  year: 2019
  note: "Second independent report of Di Forti et al. 2019 (Lancet Psychiatry, doi:10.1016/S2215-0366(19)30048-3): daily-use aOR 3.2, daily high-potency aOR 4.8, PAF 20.4%/12.2%."

cambridge_bjp_cannabis_psychosis:
  name: Cannabis and psychosis - what do we know and what should we do?
  publisher: The British Journal of Psychiatry (Cambridge)
  url: https://www.cambridge.org/core/journals/the-british-journal-of-psychiatry/article/cannabis-and-psychosis-what-do-we-know-and-what-should-we-do/D09D5E6B7A77D475B3BD63D81462BF7A
  year: 2018
  note: "Quotes Marconi, Di Forti, Lewis, Murray & Vassos 2016 (Schizophrenia Bulletin) dose-response: OR 3.90 (95% CI 2.84-5.34) for the heaviest users vs non-users."

cambridge_ijpm_heavy_cannabis:
  name: From heavy cannabis use to psychosis - is it time to take action?
  publisher: Irish Journal of Psychological Medicine (Cambridge)
  url: https://www.cambridge.org/core/journals/irish-journal-of-psychological-medicine/article/from-heavy-cannabis-use-to-psychosis-is-it-time-to-take-action/5823A4A8C798F0AE8A88078DEF9C45FC
  year: 2023
  note: "Independent second quote of Marconi et al. 2016: OR 3.90 (95% CI 2.84-5.34) for heaviest users, ~twofold for average users; meta-analysis re-examined raw data as an exposure continuum and excluded baseline-psychosis participants."

cdpc_cannabis_driving_2017:
  name: Cannabis Use and Driving - Evidence Review
  publisher: Canadian Drug Policy Coalition
  url: https://drugpolicy.ca/wp-content/uploads/2016/11/CDPC_Cannabis-and-Driving_Evidence-Review-Full_Jan31-2017_FINAL.pdf
  year: 2017
  note: "Evidence review of driving after cannabis use: Asbridge et al. 2012 OR 1.92, Li et al. 2012 OR 2.66, and the adjusted Rogeberg & Elvik 2016 estimate OR 1.22. Notes many source studies did not control for concurrent alcohol use."

nsc_cannabis_driving_position:
  name: NSC Position on Cannabis and Driving
  publisher: National Safety Council
  url: https://nsc.org/getmedia/8840b317-9960-48b9-a3ae-3fec77a9448b/Position-on-Cannabis-and-Driving.pdf
  note: "Tabulates meta-analytic crash-risk ORs: Li et al. 2012 OR 2.66 (95% CI 2.07-3.41), Asbridge et al. 2012 OR 1.92 (95% CI 1.35-2.73); French responsibility analysis showing risk rising with blood THC."

swartz_chs_jama_network_open:
  name: Cannabinoid Hyperemesis Syndrome - Lighting Up an Emergency Department Near You
  publisher: ResearchGate (JAMA Network Open publication page)
  url: https://www.researchgate.net/publication/363109451_Cannabinoid_Hyperemesis_Syndrome_Lighting_Up_an_Emergency_Department_Near_You
  note: "Swartz & Franceschini, JAMA Network Open: Nationwide Emergency Department Sample (~85% of US ED visits), ages 12+: CHS-proxy ED visits rose from 4.4 per 100,000 visits (2016) to 33.1 (Q2 2020 peak) and 22.3 (2022); highest risk ages 18-25."

hempgazette_chs_2025:
  name: Study - Cannabinoid Hyperemesis Syndrome Prevalence
  publisher: Hemp Gazette
  url: https://hempgazette.com/news/cannabinoid-hyperemesis-study-hg2611/
  year: 2025
  note: "Independent report of the Swartz & Franceschini JAMA Network Open CHS study: 188,610,906 unweighted ED visits (806M weighted); 18-25y = 35.7% of CHS patients."

cdc_mmwr_chs_2026:
  name: Trends in Emergency Department Visits Involving Cannabis Hyperemesis Syndrome Identified Using a New Diagnosis Code - United States, January 2023-May 2026
  publisher: CDC MMWR
  url: https://cdc.gov/mmwr/volumes/75/wr/mm7530a2.htm
  year: 2026
  note: "CDC surveillance using the new CHS diagnosis code; national ED-visit estimates by age, sex, race/ethnicity."

pubmed_habboushe_chs_2018:
  name: The Prevalence of Cannabinoid Hyperemesis Syndrome Among Regular Marijuana Smokers in an Urban Public Hospital
  publisher: PubMed (Basic & Clinical Pharmacology & Toxicology)
  url: https://pubmed.ncbi.nlm.nih.gov/29327809/
  year: 2018
  note: "Habboushe et al.: among 155 ED patients smoking marijuana 20+ days/month, 32.9% (95% CI 25.5-40.3%) met the CHS symptom criterion. Authors' extrapolation (2.75M Americans) rests on a single-ED convenience sample - treat as an upper-bound illustration, not a population estimate."

labroots_gorelick_2024:
  name: 31% Americans who use Marijuana have Cannabis Use Disorder
  publisher: Labroots
  url: https://www.labroots.com/trending/cannabis-sciences/26401/31-americans-marijuana-cannabis-disorder
  year: 2024
  note: "Reports Gorelick's New England Journal of Medicine review: ~52.4M Americans 12+ used cannabis in 2021 and ~16.2M met cannabis use disorder criteria (~31%); CUD co-occurs with depression, PTSD, anxiety; young adults disproportionately affected."

medscape_meier_2012:
  name: Cannabis Use in Teens Linked to Irreparable Drop in IQ
  publisher: Medscape
  url: https://www.medscape.com/viewarticle/803197?src=smo_PSYCH
  year: 2012
  note: "Reports Meier et al. 2012, PNAS (Dunedin cohort, n=1,037, followed age 7+): adolescent-onset persistent cannabis users lost an average of 8 IQ points between ages 8 and 38; quitting did not restore IQ; adult-onset use showed no effect."

livescience_meier_rogeberg:
  name: Does Pot Really Lower IQ?
  publisher: Live Science
  url: https://www.livescience.com/26247-does-pot-lower-iq.html
  year: 2013
  note: "Covers both Meier et al. 2012 and Rogeberg 2013's critique: a socioeconomic-confounding model reproduces the Dunedin IQ association, so the causal estimate may be overstated and the true effect could be zero."

pmc_rogeberg_2013:
  name: Correlations between cannabis use and IQ change in the Dunedin cohort are consistent with confounding from socioeconomic status
  publisher: PNAS (via PMC)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3600466/
  year: 2013
  note: "Rogeberg 2013, PNAS 110:4251-4254, PMCID PMC3600466: simulation shows time-varying socioeconomic confounding can reproduce the reported Dunedin associations; Meier et al.'s causal estimates are likely overestimates."

cdpe_mokrysz_2014:
  name: ICSDP short single - cannabis and IQ claim review
  publisher: Canadian Drug Policy Coalition
  url: https://cdpe.org/wp-content/uploads/dlm_uploads/2020/12/ICSDP-short-singles-5.pdf
  year: 2020
  note: "Reviews the 'cannabis lowers IQ by 8 points' claim: single small-subsample finding (38 participants, 3.7% of cohort); Mokrysz et al. 2014 (larger ALSPAC cohort) found alcohol, not cannabis, associated with IQ decline."
