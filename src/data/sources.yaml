# Central source catalog. Every citation anchor in every dataset resolves
# against the keys in this file. Add a source here first, then cite it.
#
# Catalog entries are typed as SourceCitation (src/types.js).

samhsa_nsduh:
  name: National Survey on Drug Use and Health (NSDUH)
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/data-we-collect/nsduh-national-survey-drug-use-and-health
  data_tool: https://datatools.samhsa.gov/das
  note: Annual survey of the U.S. civilian, noninstitutionalized population aged 12 or older. Multimode collection began in 2021; SAMHSA cautions against trend comparisons with 2020-and-earlier surveys.

nsduh_2021_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2021 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt39443/2021NSDUHNNR122322/2021NSDUHNNR122322.htm
  year: 2022

nsduh_2022_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2022 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt42731/2022-nsduh-annual-national-web-110923/2022-nsduh-nnr.htm
  year: 2023

nsduh_2023_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2023 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt47095/National%20Report/National%20Report/2023-nsduh-annual-national.htm
  year: 2024

nsduh_2024_annual_report:
  name: Key Substance Use and Mental Health Indicators in the United States - Results from the 2024 NSDUH
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56287/2024-nsduh-annual-national/2024-nsduh-annual-national-html-071425-edited/2024-nsduh-annual-national.htm
  year: 2025

nsduh_2023_sae_texas:
  name: 2022-2023 NSDUH State-Level Estimates - Texas State Tables
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56188/2023-nsduh-sae-state-tables_0/2023-nsduh-sae-state-tabs-texas.pdf
  year: 2024
  note: Small-area estimates; percentages are 2022-2023 annual averages, not single-year figures.

nsduh_2023_sae_percent_tables:
  name: 2022-2023 NSDUH State Estimates of Substance Use - Percentages Tables
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/sites/default/files/reports/rpt56185/2023-nsduh-sae-tables-percents/2023-nsduh-sae-tables-percent.pdf
  year: 2024
  note: National compilation; Table 2 is Marijuana Use in the Past Year by age group and state.

nhtsa_fars:
  name: Fatality Analysis Reporting System (FARS)
  publisher: NHTSA
  url: https://www.nhtsa.gov/research-data/fatality-analysis-reporting-system-fars
  note: Reserved for planned safety datasets (impaired-driving fatalities, DUIs).

umich_mtf:
  name: Monitoring the Future
  publisher: University of Michigan
  url: https://monitoringthefuture.org/
  note: Reserved for planned school-age usage datasets.

dea_scheduling:
  name: Drug Scheduling
  publisher: DEA
  url: https://www.dea.gov/drug-information/drug-scheduling
  note: Federal Controlled Substances Act schedule definitions and drug lists.

usc_farm_bill_2018:
  name: Agriculture Improvement Act of 2018 (Public Law 115-334)
  publisher: U.S. Congress
  url: https://www.congress.gov/bill/115th-congress/house-bill/2
  year: 2018
  note: Removed hemp (cannabis at or below 0.3 percent delta-9 THC by dry weight) from the CSA definition of marijuana.

tx_hb_1325_2019:
  name: House Bill 1325 (86R) - Texas consumable hemp program
  publisher: Texas Legislature
  url: https://capitol.texas.gov/BillLookup/History.aspx?LegSess=86R&Bill=HB1325
  year: 2019
  note: Authorized consumable hemp products in Texas, mirroring the 2018 Farm Bill threshold.

tx_hsc_481:
  name: Texas Health and Safety Code Chapter 481 (Texas Controlled Substances Act)
  publisher: Texas Legislature
  url: https://statutes.capitol.texas.gov/Docs/HS/htm/HS.481.htm
  note: State scheduling, penalty groups, and possession offenses.

nida_cannabis:
  name: Cannabis (Marijuana) DrugFacts
  publisher: NIDA
  url: https://nida.nih.gov/research-topics/cannabis-marijuana
  note: Compound descriptions and health-effect summaries.

cdc_wonder:
  name: CDC WONDER - Multiple Cause of Death database
  publisher: CDC / NCHS
  url: https://wonder.cdc.gov/mcd.html
  data_tool: https://wonder.cdc.gov/
  note: Underlying mortality microdata for all drug-overdose death series (ICD-10 T-codes). Final data lag about two years.

nida_overdose_rates:
  name: Drug Overdose Death Rates (trends and statistics)
  publisher: NIDA
  url: https://nida.nih.gov/research-topics/trends-statistics/overdose-death-rates
  note: Republishes NCHS/CDC WONDER national overdose death counts per drug category (opioids, synthetic opioids, cocaine, heroin, psychostimulants) with charts; convenient citable rollup of the WONDER data.

cdc_ardi:
  name: Alcohol-Related Disease Impact (ARDI) application
  publisher: CDC
  url: https://www.cdc.gov/ardi/index.html
  data_tool: https://nccd.cdc.gov/DPH_ARDI/default/default.aspx
  note: Model-based estimates of deaths attributable to excessive alcohol use (about 58 conditions, incl. fully and partially alcohol-attributable). Published as multi-year annual averages, not single years.

cdc_alcohol_facts:
  name: Facts About U.S. Deaths from Excessive Alcohol Use
  publisher: CDC
  url: https://www.cdc.gov/alcohol/facts-stats/index.html
  note: Headline page for the ARDI estimates ("more than 178,000 deaths per year, 2020-2021").

samhsa_dawn:
  name: Drug Abuse Warning Network (DAWN)
  publisher: SAMHSA
  url: https://www.samhsa.gov/data/data-we-collect/dawn-drug-abuse-warning-network
  note: Nationally representative surveillance of drug-related emergency department visits. Annual national estimates per substance.

dea_facts_marijuana:
  name: Drug Fact Sheet - Marijuana/Cannabis
  publisher: DEA
  url: https://www.dea.gov/factsheets/marijuana-cannabis
  note: States that no deaths from marijuana overdose have been reported.

un_wpp:
  name: World Population Prospects
  publisher: United Nations
  url: https://population.un.org/wpp/
  note: UN's official global population estimates and projections, revised roughly every two years. Mid-year estimates.

census_popest:
  name: Population Estimates Program (Vintage estimates)
  publisher: U.S. Census Bureau
  url: https://www.census.gov/programs-surveys/popest.html
  note: Annual July 1 estimates for the nation, states, and localities. Each vintage revises prior years - cite the vintage.

census_popclock:
  name: U.S. and World Population Clock
  publisher: U.S. Census Bureau
  url: https://www.census.gov/popclock/
  note: Running projection; the Bureau publishes headline Jan 1 projections from it each New Year.

congress_gov:
  name: Congress.gov member directory
  publisher: Library of Congress
  url: https://www.congress.gov/members
  note: Official roster of current U.S. senators and representatives.

tx_legislature_online:
  name: Texas Legislature Online
  publisher: Texas Legislature
  url: https://capitol.texas.gov/
  note: Official roster and structure of the Texas Senate (31) and House (150).

cdc_tobacco_facts:
  name: Smoking & Tobacco Use - Fast Facts
  publisher: CDC
  url: https://www.cdc.gov/tobacco/data_statistics/fact_sheets/fast_facts/index.htm
  note: Headline adult smoking/vaping prevalence and smoking-attributable mortality figures. CDC reorganized its tobacco pages in 2024 - re-pin the exact URL during cross-check.

sg_tobacco_2014:
  name: The Health Consequences of Smoking - 50 Years of Progress (Surgeon General's report)
  publisher: HHS
  url: https://www.ncbi.nlm.nih.gov/books/NBK179276/
  year: 2014
  note: Source of the 480,000-plus annual smoking-attributable deaths estimate (including secondhand smoke) that CDC still cites as current.

who_alcohol:
  name: Global status report on alcohol and health
  publisher: WHO
  url: https://www.who.int/publications/i/item/9789240096745
  note: WHO's global estimates of current drinkers, per-capita consumption, and alcohol-attributable harm. Global drinker counts are modelled estimates, not survey counts.

whitney_tx_hemp_2025:
  name: Texas Hemp-Derived Cannabinoid Market Analysis (2025)
  publisher: Whitney Economics
  url: https://whitneyeconomics.com/
  year: 2025
  note: Industry economic analysis of the Texas consumable-hemp market; source of the $5.5B annual retail sales, $10.3B economic impact, and 53,300 jobs figures used by the campaign. Industry-commissioned - treat as modelled, not agency-reported.

ohs_online_samhsa_ofmg:
  name: An Overview of SAMHSA's New Oral Fluid Testing Guidelines
  publisher: OHS Online
  url: https://ohsonline.com/articles/2020/03/01/an-overview-of-samhsas-new-oral-fluid-testing-guidelines.aspx?admgarea=news&Page=5
  year: 2020
  note: Secondary overview of the SAMHSA Mandatory Guidelines for Federal Workplace Drug Testing Programs using Oral Fluid (OFMG), published 2019-10-25, effective 2020-01-01. Source of the THC screen (4 ng/mL) / confirmation (2 ng/mL) cutoffs carried in testing.cannabis.us.oral_fluid_cutoff.

pmc_oral_fluid_review:
  name: Oral fluid testing - review (PMC3165054)
  publisher: National Library of Medicine (PMC)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3165054/
  note: Peer-reviewed review of oral-fluid drug testing. Table 1 restates the SAMHSA OFMG cannabinoids screen/confirmation cutoffs (4 and 2 µg/L); notes oral-fluid testing "is expanding at a rapid pace in nonregulated workplace testing."

pmc_thc_detection_windows:
  name: THC detection windows by specimen type (PMC4920965 Table 1)
  publisher: National Library of Medicine (PMC)
  url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4920965/table/T1/
  note: Detection-window table for THC by specimen matrix. Source of the "up to" ranges compiled in the testing.cannabis.us.detection_window_* datasets - review-table maxima, not controlled-study means.

pmc_cannabinoid_urine_chronic:
  name: Cannabinoid urine detection in chronic users (PMC2700061)
  publisher: National Library of Medicine (PMC)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2700061/
  note: Study table reporting cannabinoid metabolites detectable up to 67 days in chronic users at the EMIT 20 ng/mL cutoff. Source of the urine chronic "up to" figure.

tx_dfps_cps_drug_windows:
  name: Drug Testing Windows (CPS Appendix 1922.1)
  publisher: Texas Department of Family and Protective Services
  url: https://dfps.texas.gov/handbooks/CPS/Files/CPS_px_1922_1.asp
  note: Texas CPS reference table of drug detection windows, including THC oral-fluid detection up to 18-24 hours.

ndasa_marijuana_impairment_testing:
  name: Marijuana Impairment and Drug Testing
  publisher: NDASA
  url: https://ndasa.com/2021/11/09/marijuana-impairment-and-drug-testing/
  year: 2021
  note: NDASA explainer; source of oral-fluid detection within ~15 minutes of use and the 3-10 hour marijuana impairment window.

marconi_2016_psychosis_meta:
  name: Meta-analysis of the Association Between the Level of Cannabis Use and Risk of Psychosis
  publisher: Schizophrenia Bulletin (Oxford Academic)
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4988731/
  year: 2016
  note: Dose-response meta-analysis - ever-use vs never OR 1.41; heaviest/frequent use OR 2.09. SEEDED from review knowledge; re-verify the ORs against the published tables before flipping any dataset to cross-checked.

diforti_2019_eugei:
  name: The contribution of cannabis use to variation in the incidence of psychotic disorder across Europe (EU-GEI)
  publisher: The Lancet Psychiatry (Elsevier)
  url: https://doi.org/10.1016/S2215-0366(19)30048-3
  year: 2019
  note: Multicentre case-control study - daily use of high-potency cannabis carried a headline ~5x adjusted odds of psychotic disorder vs never-use, varying by site. SEEDED; re-verify against the published tables before cross-checked.

asbridge_2012_driving_meta:
  name: Acute cannabis consumption and motor vehicle collision risk
  publisher: The BMJ
  url: https://doi.org/10.1136/bmj.e536
  year: 2012
  note: Systematic review and meta-analysis - acute cannabis consumption associated with roughly doubled collision risk (OR 1.92), higher with greater THC exposure. SEEDED; re-verify against the published figures before cross-checked.

meier_2012_dunedin:
  name: Persistent cannabis users show neuropsychological decline from childhood to midlife
  publisher: Proceedings of the National Academy of Sciences (PNAS)
  url: https://doi.org/10.1073/pnas.1206820109
  year: 2012
  note: Dunedin cohort - persistent cannabis dependence from adolescence associated with ~8 IQ-point decline by age 38, not fully restored by cessation. Findings contested; see rogeberg_2013_dunedin_reanalysis. SEEDED; re-verify before cross-checked.

rogeberg_2013_dunedin_reanalysis:
  name: Correlations between cannabis use and IQ change in the Dunedin cohort are consistent with confounding from socioeconomic status
  publisher: Proceedings of the National Academy of Sciences (PNAS)
  url: https://doi.org/10.1073/pnas.1215678110
  year: 2013
  note: Re-analysis arguing the Dunedin IQ-decline association is consistent with socioeconomic confounding rather than a causal cannabis effect. Why the adolescent IQ dataset carries basis 'contested'. SEEDED; re-verify before cross-checked.

nhtsa_marijuana_congress_report:
  name: Marijuana-Impaired Driving - A Report to Congress
  publisher: NHTSA
  url: https://www.nhtsa.gov/behavioral-research/marijuana-impaired-driving-report-congress
  year: 2017
  note: NHTSA concluded the science could not support a per-se THC impairment threshold analogous to 0.08 BAC - the federal impairment number is honestly 'unknown'. SEEDED; re-verify the report text before cross-checked.

rand_spending_2019:
  name: What America's Users Spend on Illegal Drugs, 2006-2016 (RR-3140-ONDCP)
  publisher: RAND Corporation (for the White House Office of National Drug Control Policy)
  url: https://www.rand.org/pubs/research_reports/RR3140.html
  year: 2019
  note: Model-based estimates (price, use, and consumption data; partly built on the now-discontinued ADAM arrestee program) of US retail spending on cannabis, cocaine (incl. crack), heroin, and methamphetamine. Headline number is ~$150 billion (2018 dollars) across the four drugs in 2016; cannabis $34B (2006) -> $52B (2016) covering legal and illegal sources; cannabis market roughly the size of cocaine + meth combined; heroin market closer to marijuana's size than to the others. Alcohol consumer spending in a companion comparison came to $158B (2017). SEEDED; re-verify the report's per-drug table before cross-checked.

vangst_whitney_cannabis_sales_2025:
  name: The State of Cannabis Jobs (2025 Vangst Jobs Report, in partnership with Whitney Economics)
  publisher: Vangst / Whitney Economics
  url: https://ganjapreneur.com/report-u-s-cannabis-sales-reached-30-1-billion-in-2024/
  year: 2025
  note: Secondary reporting (Ganjapreneur) of the annual Vangst jobs report. US regulated cannabis retail reached $30.1B in 2024 (+4.5% YoY), ~425,000 full-time jobs, ~$34B forecast for 2025. BDSA's broader estimate cited alongside is ~$31.6B (adult-use $23.9B + medical $7.7B), showing how much the number moves with coverage assumptions. Figures are industry-analyst estimates, not government statistics. SEEDED; re-verify against the primary report before cross-checked.

norml_legal_sales_2025:
  name: "Analysis: State-Legal Cannabis Sales Top $30 Billion in 2024"
  publisher: NORML
  url: https://norml.org/blog/2025/05/13/analysis-state-legal-cannabis-sales-top-30-billion-in-2024/
  year: 2025
  note: NORML synthesis of state cannabis sales data. State-legal retail sales topped $30B in 2024; adult-use sales have generated $20B+ in state tax revenue since 2014. Corroborates the Vangst/Whitney $30.1B figure from the tax-revenue direction. SEEDED; re-verify before cross-checked.

unodc_cocaine_market_2010:
  name: World Drug Report 2010 - The global cocaine market
  publisher: UN Office on Drugs and Crime
  url: https://news.un.org/en/story/2011/05/374612
  year: 2010
  note: The most recent comprehensive UNODC valuation of the global cocaine market is ~$85B (constant 2009 dollars; range $75-100B) in 2009, with US ~$37B and Europe ~$33B (2011 Fedotov statement, via UN News) and ~$84B in estimated global profit. DATED - UNODC has not published an updated global market-value estimate since; current value is an honest unknown even as 2023-2025 production hit records. SEEDED; re-verify the WDR 2010 tables before cross-checked.

researchandmarkets_us_alcohol_2025:
  name: United States Alcoholic Beverages Market Size and Share Analysis - Growth Trends and Forecast Report 2025-2033
  publisher: Research and Markets (press release via Business Wire)
  url: https://businesswire.com/news/home/20250321928282/en/United-States-Alcoholic-Beverages-Market-Trends-and-Forecast-Report-2025-2033-Increasing-Consumer-Demand-for-Craft-Beers-Premium-Spirits-and-Healthy-Options---ResearchAndMarkets.com
  year: 2025
  note: Industry-analyst market sizing puts the US alcoholic beverages market at $543.13B in 2024, forecast $806.44B by 2033 (~5% CAGR). Not government statistics - methodology not public. Compare RAND's consumer-spending figure ($158B, 2017); the two measure different things (total market vs. consumer retail spend). SEEDED; re-verify before cross-checked.

marketresearchfuture_tobacco_2024:
  name: Tobacco Products Market Trends (Market Research Future)
  publisher: Market Research Future
  url: https://www.marketresearchfuture.com/reports/tobacco-products-market/market-trends
  year: 2025
  note: Industry-analyst sizing puts the global tobacco products market at $966.22B in 2024 (cigarettes $600B, roll-your-own $216.22B), projected $1,426.02B by 2035 at 3.6% CAGR. Separately, the Tobacco Global Strategic Business Report (GlobeNewswire, 2024) put the 2023 global market at $904.9B, rising to $1.1T by 2030. Analyst estimates, not official statistics; no US-specific total carried. SEEDED; re-verify before cross-checked.
