description: >-
  Estimated annual U.S. emergency department visits involving cannabis, from
  SAMHSA's Drug Abuse Warning Network national estimates. "Involving" means
  cannabis was recorded among the substances for the visit, not that it was
  the sole or primary cause - DAWN visits routinely involve multiple
  substances. This is the honest counterweight to the zero-overdose-deaths
  figure: cannabis harms show up in ERs, not morgues.

